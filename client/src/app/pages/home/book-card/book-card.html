<article class="flex h-full flex-col rounded-lg bg-linen p-4 shadow-card">
  <div class="aspect-[3/4] w-full overflow-hidden lg:mx-auto lg:w-3/4 rounded-sm bg-stone-300 shadow-book">
    @if (!imageFailed()) {
      <img
        [src]="book().imageUrl"
        [alt]="book().title + ' cover'"
        class="h-full w-full object-cover"
        (error)="imageFailed.set(true)"
      />
    } @else {
      <div class="flex h-full items-center justify-center p-4 text-center font-serif text-forest">
        {{ book().title }}
      </div>
    }
  </div>

  <h3 class="mt-4 font-serif text-base text-forest md:text-lg">{{ book().title }}</h3>
  <p class="text-sm text-stone-500">by {{ book().author }}</p>

  @if (book().rating; as rating) {
    <p
      class="mt-auto flex items-center gap-0.5 pt-2 text-sm"
      [attr.aria-label]="'Rated ' + rating + ' out of 5'"
    >
      @for (star of stars; track star) {
        <span
          aria-hidden="true"
          [class]="star <= rating + 0.5 ? 'text-gold' : 'text-stone-300'"
          >★</span
        >
      }
      <span aria-hidden="true" class="ml-2 font-semibold text-forest">{{ rating }}</span>
    </p>
  }
</article>
