<main class="mx-auto max-w-360">
  <!-- Hero -->
  <section
    class="m-4 grid grid-cols-1 items-center gap-10 border border-blue-200 p-6 md:grid-cols-2 md:gap-20 md:p-20"
  >
    <div>
      <p
        class="flex items-center gap-3 text-xs font-semibold tracking-wider text-amber-700 uppercase"
      >
        <span class="h-px w-6 bg-amber-700"></span>
        Chingu Book Club
      </p>
      <h1 class="mt-6 font-serif text-4xl leading-tight md:text-6xl">
        Better code starts with better conversations.
      </h1>
      <p class="mt-6 max-w-xl text-lg leading-relaxed text-stone-600">
        Read alongside other Chingu developers, share what clicked, and learn what the job doesn't
        teach you on day one.
      </p>
    </div>
    <div>
      <img
        [src]="heroImage"
        [alt]="heroAlt"
        class="aspect-[4/3] w-full max-w-120 rounded-lg object-cover shadow-xl"
      />
    </div>
    <div class="flex justify-between">
      <button class="rounded-sm bg-forest px-8 py-4 text-neutral-50">Become a Member</button>
      <button class="rounded-sm border-1 border-forest text-forest px-8 py-4">
        See What We're Reading
      </button>
    </div>
  </section>

  <!-- Book of the month + upcoming sessions -->
  <section id="book-of-the-month" class="m-4 grid gap-8 p-6 md:grid-cols-3 md:p-20">
    <div class="md:col-span-2">
      @if (featuredBook(); as book) {
        <app-book-of-the-month [book]="book" />
      }
    </div>

    <aside class="rounded-2xl border border-stone-200 p-8">
      <!-- Upcoming sessions: next step -->
    </aside>
  </section>

  <!-- Highly regarded literature -->
  <section class="py-12"></section>

  <!-- Latest member thoughts -->
  <section class="py-12"></section>
</main>
