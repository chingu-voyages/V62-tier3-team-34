<article class="flex flex-col gap-8 rounded-2xl bg-linen p-8 mt-0 sm:flex-row sm:items-center">
  <img
    [src]="book().imageUrl"
    [alt]="book().title + ' cover'"
    class="w-40 shrink-0 self-center rounded-sm shadow-xl sm:self-auto"
  />

  <div>
    <p class="text-xs font-semibold tracking-wider text-amber-700 uppercase">Book of the month</p>
    <h3 class="mt-2 font-serif text-4xl text-forest">{{ book().title }}</h3>
    <p class="mt-1 text-stone-500">by {{ book().author }}</p>
    <p class="mt-4 leading-relaxed text-stone-700">{{ book().description }}</p>
    <button class="mt-6 rounded-full bg-forest px-6 py-3 text-sm text-white">
      Join Discussion
    </button>
  </div>
</article>
