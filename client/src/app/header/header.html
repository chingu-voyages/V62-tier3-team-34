<header class=" relative bg-amber-25 shadow-sm">
  <div class="w-full max-w-none mx-0 px-4 sm:px-6 py-3 
  flex items-center justify-between gap-4">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 shrink-0">
      <img
        src="/images/chingu_actual_logo.png"
        alt="Chingu Book Club logo"
        class="w-10 h-10 sm:w-12 sm:h-12 object-contain"
      />
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-amber-900">CHINGU</h1>
        <p class="text-xs tracking-widest text-amber-700">BOOK CLUB</p>
      </div>
    </a>
    <!-- navigation -->
    <nav class="hidden md:flex items-center 
    justify-center gap-3 lg:gap-5 flex-1">
    @if(router.url !== '/') {
      <a
        routerLink="/"
        class="text-amber-950 hover:text-forest hover:-translate-y-0.5
        whitespace-nowrap 
        transition-all duration-300"
        >Home</a>
    }
      <a
        routerLink="/why-reading-matters"
        class="text-amber-950 hover:text-forest hover:-translate-y-0.5
        whitespace-nowrap
         transition-all duration-300"
        >Why Reading Matters</a>
      <a
        routerLink="/reading-habit"
        class="text-amber-950 hover:text-forest hover:-translate-y-0.5
        whitespace-nowrap
         transition-all duration-300"
        >Reading Habit</a>
      <a
        routerLink="/read-discuss"
        class="text-amber-950 hover:text-forest hover:-translate-y-0.5
        whitespace-nowrap
         transition-all duration-300"
        >Read & Discuss</a>
      <a
        routerLink="/about"
        class="text-amber-950 hover:text-forest hover:-translate-y-0.5
        whitespace-nowrap
         transition-all duration-300"
        >About</a>
    </nav>
    <a
      routerLink="/sign-in"
      class="hidden md:inline-flex items-center justify-center gap-2
      rounded-full border border-forest bg-white px-6 py-2 leading-5
       text-amber-950 
      font-medium transition hover:bg-forest hover:text-cream shrink-0
       whitespace-nowrap
      hover:shadow-button-hover focus-visible:outline-2 
      focus-visible:outline-offset-2
     focus-visible:outline-amber-700 
      motion-reduce:transition-none">
      Sign In
    </a>

    <!-- Mobile menu button -->
    <button
      type="button"
      class="md:hidden justify-self-end rounded-lg p-2 text-amber-950
       hover:bg-white transition-colors"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-navigation"
      aria-label="Toggle navigation menu">
      @if (menuOpen()) {
        <span aria-hidden="true">✕</span>
      } @else {
        <span aria-hidden="true">☰</span>
      }
    </button>
  </div>

  <!-- Mobile navigation -->
  @if (menuOpen()) {
    <nav
      id="mobile-navigation"
      class=" absolute top-full left-0 right-0 z-50 
      md:hidden flex flex-col gap-1 pt-4 px-4 pb-4 border-t
       border-amber-200 bg-amber-50 shadow-lg"
      aria-label="Mobile navigation">
      @if(router.url !== '/') {
      <a
        routerLink="/"
        (click)="closeMenu()"
        class="rounded-lg px-3 py-2 text-amber-950 hover:bg-white
         hover:text-green-900 transition-colors">
        Home
      </a>
    }
      <a
        routerLink="/why-reading-matters"
        (click)="closeMenu()"
        class="rounded-lg px-3 py-2 text-amber-950 hover:bg-white
         hover:text-green-900 transition-colors">
        Why Reading Matters
      </a>

      <a
        routerLink="/reading-habit"
        (click)="closeMenu()"
        class="rounded-lg px-3 py-2 text-amber-950 hover:bg-white
         hover:text-green-900 transition-colors">
        Reading Habit
      </a>

      <a
        routerLink="/read-discuss"
        (click)="closeMenu()"
        class="rounded-lg px-3 py-2 text-amber-950 hover:bg-white
         hover:text-green-900 transition-colors">
        Read &amp; Discuss
      </a>

      <a
        routerLink="/about"
        (click)="closeMenu()"
        class="rounded-lg px-3 py-2 text-amber-950 hover:bg-white
         hover:text-green-900 transition-colors">
        About
      </a>

      <a
        routerLink="/sign-in"
        (click)="closeMenu()"
        class="mt-2 rounded-full border border-amber-900 px-5 py-2 
        text-center text-amber-950 
        font-medium hover:bg-white hover:text-green-900 transition-colors">
        Sign In
      </a>
    </nav>
  }
</header>
